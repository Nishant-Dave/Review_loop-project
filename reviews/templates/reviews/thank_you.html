<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☕</text></svg>">
</head>
<body style="font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; padding: 20px; background-color: #f9fafb;">
    {% if show_flash %}
        <div id="flash-state">
            <div style="font-size: 4.5rem; text-align: center; margin-bottom: 10px;">✅</div>
            <h2 style="color: #111827; margin-top: 10px; font-size: 1.8rem; text-align: center;">Feedback Submitted!</h2>
        </div>
        <div id="final-state" style="display: none; animation: fadeInSlideUp 0.3s ease-out;">
            <h2 style="color: #111827; margin-bottom: 10px;">Thanks for helping us improve ❤️</h2>
            <p style="color: #4b5563; font-size: 1.1rem; max-width: 400px; line-height: 1.5;">We’ll use this to improve your next experience.</p>
        </div>
        <style>
            @keyframes fadeInSlideUp {
                from { opacity: 0; transform: translateY(15px); }
                to { opacity: 1; transform: translateY(0); }
            }
        </style>
        <script>
            setTimeout(() => {
                document.getElementById('flash-state').style.display = 'none';
                document.getElementById('final-state').style.display = 'block';
            }, 1500);
        </script>
    {% else %}
        <h2 style="color: #111827; margin-bottom: 10px;">Thanks for helping us improve ❤️</h2>
        <p style="color: #4b5563; font-size: 1.1rem; max-width: 400px; line-height: 1.5;">We’ll use this to improve your next experience.</p>
    {% endif %}
</body>
</html>
